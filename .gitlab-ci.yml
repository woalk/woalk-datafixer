stages:
  - test
  - build
  - publish

image: mcr.microsoft.com/openjdk/jdk:25-ubuntu

cache:
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .gradle/loom-cache/

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

fabric junit:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

build:
  stage: build
  script:
    - ./gradlew build
  artifacts:
    paths:
      - build/libs/woalk_datafixer-*.jar
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "push"

modrinth:
  stage: publish
  needs:
    - build
  script:
    - ./gradlew modrinth
  rules:
    - if: $CI_COMMIT_TAG && $MODRINTH_TOKEN
